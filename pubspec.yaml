name: zapsafe_mobile
description: "ZapSafe — personal safety app with AI-powered distress detection, SOS alerts, and trusted-contact response."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:           # Days 101-102 — i18n
    sdk: flutter
  easy_localization: ^3.0.7        # Days 101-102 — i18n

  # Core state management & navigation
  flutter_riverpod: ^2.4.0
  go_router: ^12.0.0

  # HTTP & networking
  dio: ^5.3.0

  # Local storage
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Sensors & permissions
  sensors_plus: ^4.0.0
  geolocator: ^10.0.0
  permission_handler: ^11.0.0
  url_launcher: ^6.3.1              # Day 238 — regional emergency tel: links
  device_info_plus: ^9.0.0
  local_auth: ^2.1.0

  # Firebase & notifications - wired up Day 16 (Month 1, Week 4)
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.2
  # firebase_crashlytics: ^3.4.0  # Day 17+

  # Crash reporting — real SDK wired Day 257 (was a mock screen until then).
  # DSN comes from --dart-define=SENTRY_DSN=..., never committed; with no DSN
  # the app boots normally with reporting disabled.
  sentry_flutter: ^7.16.0

  # Google sign-in — Day 257. Added because DLT registration (mandatory for
  # any SMS to Indian numbers) charges an up-front fee on every operator
  # portal and takes 1-2 weeks of approvals, so OTP — the app's only sign-up
  # path — could not work at all. Google sign-in has no SMS, no regulator
  # and no per-verification cost. The OTP path stays wired for when DLT
  # lands; this is additive, not a replacement.
  firebase_auth: ^4.16.0
  google_sign_in: ^6.2.1

  # AI/ML — wired Day 31 (placeholder models today; real .tflite files Month 3)
  tflite_flutter: ^0.10.4
  # google_mlkit_face_detection: ^0.9.0  # later

  # UI enhancements
  flutter_animate: ^4.2.0
  fl_chart: ^0.63.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.1

  # Networking & WebSocket
  web_socket_channel: ^2.4.0
  connectivity_plus: ^5.0.0

  # Day 38 — battery threshold handler
  battery_plus: ^5.0.0

  # Utilities
  cupertino_icons: ^1.0.6
  intl: ^0.18.1          # pinned by flutter_localizations SDK (Days 101-102)
  uuid: ^4.0.0

  # Onboarding / product-tour widgets — requested alongside the backend
  # Day 246-250 batch. No Flutter port of react-joyride exists; these
  # three cover the same spotlight-and-tooltip walkthrough use case.
  # Caret ranges below are best-effort at time of writing — run
  # `flutter pub get` (or `flutter pub outdated`) to confirm/resolve the
  # actual latest compatible versions before relying on these.
  showcaseview: ^3.0.0
  feature_discovery: ^0.14.1
  tutorial_coach_mark: ^1.2.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/fonts/
    - assets/translations/          # Days 101-102 — i18n JSON files
    # assets/icons/ and assets/data/emergency_numbers.json (Day 238 — regional
    # emergency numbers) were referenced here since the original Days 1-200
    # commit but the actual files were never committed to git and don't exist
    # anywhere on disk on this machine — confirmed via a full workspace search
    # 2026-08-07. This was silently blocking `flutter test`/`flutter build`
    # from any fresh checkout. Re-add both lines once the real content exists
    # (real icon assets; real, verified regional emergency phone numbers —
    # do not fabricate the latter, it's safety-critical data).

  # ZapSafe Design System Fonts (Day 2)
  # ClashDisplay: headings, mode labels, score numbers
  # Syne: body, labels, descriptions
  # IBMPlexMono: hashes, timestamps, technical info
  fonts:
    - family: ClashDisplay
      fonts:
        - asset: assets/fonts/ClashDisplay-Regular.ttf
        - asset: assets/fonts/ClashDisplay-Bold.ttf
          weight: 700
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Regular.ttf
        - asset: assets/fonts/Syne-Medium.ttf
          weight: 500
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
