plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Day 257 — must come AFTER the Android and Flutter plugins.
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.zapsafe.zapsafe_mobile"
    compileSdk flutter.compileSdkVersion
    // Day 257 — pinned rather than flutter.ndkVersion. Adding firebase_auth
    // pulled in native plugins that require a newer NDK than Flutter's
    // default, and the build fails outright with "One or more plugins
    // require a higher Android NDK version" until this is set.
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.zapsafe.zapsafe_mobile"
        minSdkVersion 26
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // Day 24 — periodic watchdog that restarts ZapSafeService if the
    // foreground service hasn't pinged in 30 seconds (LP4 contract).
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Day 257 — required once Firebase was added, and only then.
    //
    // WorkManager's getWorkInfosForUniqueWork() returns Guava's
    // ListenableFuture (used in WatchdogChannelHandler.isEnqueued). On its
    // own, androidx.work supplies com.google.guava:listenablefuture:1.0 for
    // that class. Firebase depends on real Guava, which also publishes
    // listenablefuture as an EMPTY marker artifact
    // (9999.0-empty-to-avoid-conflict-with-guava) so the two cannot clash.
    // Gradle picks the higher version — the empty one — and the class
    // disappears from the compile classpath entirely:
    //   "Cannot access class ListenableFuture. Check your module classpath"
    // Depending on real Guava puts the class back.
    implementation 'com.google.guava:guava:32.1.3-android'
}
